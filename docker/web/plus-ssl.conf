<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@plus.microsystems.company
    ServerName plus.microsystems.company

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /var/www/certificate/plus.microsystems.company.crt
    SSLCertificateKeyFile /var/www/certificate/plus.microsystems.company.key
    SSLCertificateChainFile /var/www/certificate/plus.microsystems.company.chainfile.pem

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>


    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
</VirtualHost>
</IfModule>
